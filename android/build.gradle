buildscript {
  ext.getExtOrDefault = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.1.20')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
// Codegen: generates NativeBottomSheetManagerInterface / -Delegate from the
// JS spec into com.facebook.react.viewmanagers (see package.json).
apply plugin: "com.facebook.react"

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

android {
  namespace "com.bottomsheetnative"
  compileSdkVersion getExtOrDefault("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 35)
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Spring settle for the detent physics (velocity-aware, matches the iOS
  // UIKit spring). Declared explicitly rather than relying on transitives.
  implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
  // Back / predictive-back through the dispatcher (targetSdk 36 ignores
  // onBackPressed overrides).
  implementation "androidx.activity:activity-ktx:1.9.3"
}

react {
  // Library codegen: reads codegenConfig from package.json.
  jsRootDir = file("../src/")
  libraryName = "RNBottomSheetNativeSpec"
  codegenJavaPackageName = "com.facebook.react.viewmanagers"
}
